# Layered on detekt's default config (buildUponDefaultConfig). Zero issues; never add a
# baseline to get past a finding (kmp-agentic-sdlc .claude/docs/kotlin-style.md rule 3).
build:
  maxIssues: 0

style:
  MagicNumber:
    # Color science is published constants (sRGB matrices, CIE Lab, CIEDE2000): naming each one adds
    # nothing but noise. Outside color/ the rule stands; tests are excluded by default.
    excludes: ['**/commonTest/**', '**/jvmTest/**', '**/iosTest/**', '**/core/color/**']
    ignoreEnums: true

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

# :detekt-rules — the fleet's project rules.
fleet:
  ForbiddenNotNullAssertion:
    active: true
